<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="gas-mode: orquestador para Claude Code con gates de verificación. Planificar (Opus), Implementar (Sonnet), Verificar (Opus), Revisar (Opus), Commit. Si falla, vuelve a Implementar, máximo 2 rondas.">
  <rect x="1" y="1" width="1198" height="398" rx="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="80" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#e6edf3"><tspan fill="#ff922b">gas</tspan>-mode</text>
  <text x="82" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9198a1">Orquestador para Claude Code con gates de verificación</text>

  <line x1="130" y1="290" x2="1070" y2="290" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#9198a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M241 282 L250 290 L241 298"/>
    <path d="M476 282 L485 290 L476 298"/>
    <path d="M711 282 L720 290 L711 298"/>
    <path d="M946 282 L955 290 L946 298"/>
  </g>

  <g fill="none" stroke="#9198a1" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M835 312 V344 H365 V318"/>
    <path d="M600 312 V344"/>
  </g>
  <path d="M357 324 L365 313 L373 324" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#161b22" stroke="#ff922b" stroke-width="4">
    <circle cx="130" cy="290" r="15"/>
    <circle cx="365" cy="290" r="15"/>
    <path d="M600 270 L620 290 L600 310 L580 290 Z" stroke-linejoin="round"/>
    <path d="M835 270 L855 290 L835 310 L815 290 Z" stroke-linejoin="round"/>
  </g>
  <circle cx="1070" cy="290" r="19" fill="#ff922b"/>
  <path d="M1061 290 l6 6 l12 -13" fill="none" stroke="#161b22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="600" fill="#e6edf3">
      <text x="130" y="232">Planificar</text>
      <text x="365" y="232">Implementar</text>
      <text x="600" y="232">Verificar</text>
      <text x="835" y="232">Revisar</text>
      <text x="1070" y="232">Commit</text>
    </g>
    <g font-size="15" fill="#9198a1">
      <text x="130" y="256">Opus</text>
      <text x="365" y="256">Sonnet</text>
      <text x="600" y="256">Opus · gate</text>
      <text x="835" y="256">Opus · gate</text>
      <text x="1070" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Verificado:</text>
    </g>
    <text x="600" y="374" font-size="15" fill="#9198a1">falla → vuelve a Implementar · máx. 2 rondas, después escala al usuario</text>
  </g>
</svg>
